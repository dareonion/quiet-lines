[project]
name = "toddler-ipad"
version = "0.1.0"
description = "Quiet Lines: a calm offline iPad web app for young children (numbers, letters, Chinese characters, tracing, drawing)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
toddler-ipad = "toddler_ipad.server:main"
toddler-ipad-build = "toddler_ipad.site:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright==1.63.0",
    "pytest>=9.2.0",
]
voices = [
    "numpy>=2.5.5",
    "praat-parselmouth>=0.4.7",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
